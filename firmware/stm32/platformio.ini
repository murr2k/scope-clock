; Scope clock -- STM32 firmware, two targets.
;
;   pio run -e nucleo_f401re            build the PWM-DAC intermediate build
;   pio run -e nucleo_f401re -t upload  flash over the on-board ST-Link
;   pio run -e disco_f407vg             build the true-DAC final build
;
; The font table (src/font_vec.c/.h) is generated:
;   python ../../tools/gen_font.py

[env]
platform = ststm32
framework = libopencm3
build_flags =
    -Os
    -Wall
    -Wextra
    -Wno-unused-parameter
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    ; newlib-nano: full newlib's printf/reent machinery costs ~9.4 KB of RAM,
    ; which does not fit beside the frame buffers on the G431's 32 KB.
    -specs=nano.specs
    ; drop unreferenced sections (libopencm3 pulls in USB, FDCAN, ... otherwise)
    -ffunction-sections
    -fdata-sections
build_unflags = -specs=nosys.specs
extra_scripts = pre:gc_sections.py
upload_protocol = stlink
debug_tool = stlink

; ---------------------------------------------------------------------------
; NUCLEO-G491RE: the full-quality DAC build (the board on the bench).
; 96 KB contiguous SRAM fits the whole 4096-point budget, so no custom linker
; script is needed here.  `board` points at boards/nucleo_g491re_ocm3.json
; because platform-ststm32's stock nucleo_g491re lists stm32cube only.
; NOTE: open solder bridge SB6 to disconnect LD2 from PA5 (= DAC1_OUT2 / Y).
; ---------------------------------------------------------------------------
[env:nucleo_g491re]
board = nucleo_g491re_ocm3
build_flags = ${env.build_flags} -DBOARD_NUCLEO_G491RE
build_src_filter = +<*> -<dac_dma.c> -<pwm_dma.c>
monitor_port = COM13
monitor_speed = 115200

; ---------------------------------------------------------------------------
; NUCLEO-G431KB: the minimal-chip build.  DAC1's two channels have buffered
; outputs that drive the scope directly, so there is no op-amp: 1 IC + 1
; transistor for Z-blank.  Constraint is 32 KB SRAM -> 1536-point frames.
; No user button on Nucleo-32; change mode with MODE= over the VCP.
; ---------------------------------------------------------------------------
[env:nucleo_g431kb]
board = nucleo_g431kb
build_flags = ${env.build_flags} -DBOARD_NUCLEO_G431KB
build_src_filter = +<*> -<dac_dma.c> -<pwm_dma.c>
; The board definition declares only 22 KB of RAM (SRAM1 16K + SRAM2 6K),
; leaving the 10 KB CCM SRAM unused.  On category 2 G4 parts the CCM is aliased
; at 0x20005800, immediately after SRAM2, giving one contiguous 32 KB block --
; and DMA can reach the CCM *only* through that alias, which is exactly the
; region we are claiming.  So the frame buffers are safe to place there.
; Without this the link overflows: the frames alone are ~24 KB. (RM0440 sec 2.4)
board_build.ldscript = ld/stm32g431kb_32k.ld
board_upload.maximum_ram_size = 32768

; ---------------------------------------------------------------------------
; Nucleo-F401RE: no DAC on this part, so X/Y are PWM + external RC filters.
; PA6 = X, PA7 = Y, PC13 = mode button, USART2 = ST-Link virtual COM port.
; Time/mode are set by typing the ESP-01 protocol into a serial terminal:
;   T=<utc_epoch>   TZ=<offset_sec>   MODE=ANALOG   M=<text>
; USE_LSI because the Nucleo's 32.768 kHz crystal is not populated.
; ---------------------------------------------------------------------------
[env:nucleo_f401re]
board = nucleo_f401re
build_flags = ${env.build_flags} -DBOARD_NUCLEO_F401RE
build_src_filter = +<*> -<dac_dma.c> -<dac_dma_g4.c>

; ---------------------------------------------------------------------------
; STM32F4-Discovery: true dual 12-bit DAC + Z-blanking (the final design).
; Add if the 32.768 kHz LSE crystal (X2) is not populated.
; ---------------------------------------------------------------------------
[env:disco_f407vg]
board = disco_f407vg
build_flags = ${env.build_flags} -DBOARD_DISCO_F407VG
build_src_filter = +<*> -<pwm_dma.c> -<dac_dma_g4.c>
